<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root{
    --desk: #212D38;
    --paper: #F7F1E4;
    --paper-line: #DED2B4;
    --ink: #2B2620;
    --ink-soft: #5C5445;
    --redpen: #A6362C;
    --sage: #5B7A5D;
    --stamp: #C9A227;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    min-height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(255,255,255,0.05), transparent 45%),
      var(--desk);
    font-family:'Noto Sans KR', 'Malgun Gothic', sans-serif;
    color:var(--paper);
    padding:20px 14px 40px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:460px; }
  .hidden{ display:none !important; }

  /* ---------- Install banner ---------- */
  .install-banner{
    background:rgba(201,162,39,0.14);
    border:1px solid rgba(201,162,39,0.4);
    border-radius:6px;
    padding:11px 12px;
    font-size:12px;
    line-height:1.6;
    color:#F0E4C4;
    margin-bottom:16px;
    position:relative;
  }
  .install-banner b{ color:var(--stamp); }
  .install-close{
    position:absolute; top:6px; right:8px;
    background:none; border:none; color:#F0E4C4; font-size:14px;
    cursor:pointer; opacity:0.7;
  }

  /* ---------- Header ---------- */
  .brand{ text-align:center; margin-bottom:18px; }
  .brand-title{
    font-family:'Nanum Myeongjo', Georgia, serif;
    font-weight:800; font-size:22px; letter-spacing:0.02em;
    color:var(--paper); margin:0;
  }
  .brand-sub{ font-size:12.5px; color:#A9B4BC; margin-top:4px; }

  /* ---------- Topic screen ---------- */
  .stamp-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px;
  }
  .stamp{
    background:var(--paper); border:none; border-radius:3px;
    padding:18px 12px 14px; cursor:pointer; text-align:left; position:relative;
    font-family:'Noto Sans KR', sans-serif;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 3px 0 rgba(0,0,0,0.18);
  }
  .stamp:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.18); }
  .stamp::before{
    content:''; position:absolute; inset:5px;
    border:1.5px dashed rgba(43,38,32,0.28); border-radius:2px; pointer-events:none;
  }
  .stamp-emoji{ font-size:22px; display:block; margin-bottom:8px; }
  .stamp-name{ font-weight:700; color:var(--ink); font-size:14.5px; display:block; }
  .stamp-desc{ color:var(--ink-soft); font-size:11.5px; display:block; margin-top:2px; line-height:1.4; }

  /* ---------- Chat screen ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .dl-btn{
    background:none; border:none; font-size:16px; cursor:pointer; color:#A9B4BC;
    padding:2px 4px; -webkit-tap-highlight-color:transparent;
  }
  .back-btn{
    background:none; border:none; color:#A9B4BC; font-size:13px;
    cursor:pointer; font-family:'Noto Sans KR', sans-serif; padding:6px 0;
  }
  .topic-badge{
    background:var(--stamp); color:#2B2005; font-size:11.5px; font-weight:700;
    padding:5px 10px; border-radius:20px;
  }

  .page{
    background:var(--paper); border-radius:4px; padding:20px 18px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    background-image: repeating-linear-gradient(
      to bottom, transparent, transparent 30px,
      var(--paper-line) 30px, var(--paper-line) 31px
    );
    min-height:340px; max-height:56vh; overflow-y:auto;
  }

  .turn{ margin-bottom:22px; }
  .turn:last-child{ margin-bottom:4px; }

  .partner-label, .user-label{
    font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em; margin:0 0 2px;
  }
  .user-label{ text-align:right; }

  .partner-row{ display:flex; align-items:baseline; gap:8px; }
  .partner-line, .user-line{
    font-family:'Nanum Myeongjo', Georgia, serif;
    color:var(--ink); font-size:16px; line-height:31px; margin:0;
  }
  .partner-line{ flex:1; }
  .user-line{ text-align:right; }
  .user-line.has-issue{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: rgba(166,54,44,0.55);
    text-decoration-thickness: 1.5px;
  }

  .speak-btn{
    background:none; border:none; cursor:pointer; font-size:16px;
    color: var(--ink-soft); padding:0 2px; line-height:31px; flex-shrink:0;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .speak-btn.playing{ color: var(--redpen); }
  .speak-btn.small{ font-size:13px; line-height:1.3; margin-top:2px; }

  .redpen-row{
    display:flex; justify-content:flex-end; align-items:baseline; gap:6px;
  }
  .redpen-note{
    font-family:'Gaegu', cursive; color: var(--redpen); font-size:17px;
    text-align:right; margin:2px 0 0; line-height:1.3;
  }
  .redpen-note::before{ content:'✎ '; }

  .explain-note{
    font-family:'Nanum Myeongjo', Georgia, serif; font-style:italic;
    color: var(--ink-soft); font-size:12.5px; text-align:right; margin:3px 0 0; line-height:1.5;
  }

  .ok-mark{
    font-family:'Gaegu', cursive; color: var(--sage); font-size:15px;
    text-align:right; margin:2px 0 0;
  }
  .ok-mark::before{ content:'✓ '; }

  .thinking{
    font-family:'Nanum Myeongjo', Georgia, serif; color: var(--ink-soft);
    font-size:15px; font-style:italic;
  }

  /* ---------- Input row ---------- */
  .input-row{ display:flex; gap:8px; margin-top:14px; }
  .input-row input{
    flex:1; background:var(--paper); border:none; border-radius:4px;
    padding:13px 14px; font-family:'Nanum Myeongjo', Georgia, serif;
    font-size:15px; color:var(--ink); outline:none;
  }
  .input-row input::placeholder{ color:#9A9182; font-family:'Noto Sans KR', sans-serif; font-size:13px; }

  .mic-btn{
    background:var(--paper); color:var(--ink); border:none; border-radius:4px;
    width:46px; font-size:18px; cursor:pointer; flex-shrink:0;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .mic-btn.recording{ background: var(--redpen); color:#fff; animation: pulse 1.1s infinite; }
  .mic-status{
    font-size:11px; color:#E8B4AE; text-align:center; margin-top:6px; min-height:14px;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(166,54,44,0.5); }
    70%{ box-shadow:0 0 0 9px rgba(166,54,44,0); }
    100%{ box-shadow:0 0 0 0 rgba(166,54,44,0); }
  }

  .send-btn{
    background:var(--stamp); color:#2B2005; border:none; border-radius:4px;
    padding:0 18px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif; flex-shrink:0;
  }
  .send-btn:disabled{ opacity:0.5; cursor:default; }

  .hint{ font-size:11.5px; color:#8A97A0; text-align:center; margin-top:10px; }

  .error-box{
    background:rgba(166,54,44,0.15); border:1px solid rgba(166,54,44,0.4);
    color:#E8B4AE; font-size:12.5px; padding:10px 12px; border-radius:4px; margin-top:10px;
  }
</style>
</head>
<body>
  <div class="wrap">

    <div id="installBanner" class="install-banner hidden">
      <button class="install-close" id="installClose">✕</button>
      <span id="installText"></span>
    </div>

    <!-- ===== Topic Screen ===== -->
    <div id="topicScreen">
      <div class="brand">
        <p class="brand-title">대화 노트</p>
        <p class="brand-sub">오늘은 어떤 이야기를 나눠볼까요?</p>
      </div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

    <!-- ===== Chat Screen ===== -->
    <div id="chatScreen" class="hidden">
      <div class="topbar">
        <button class="back-btn" id="backBtn">← 주제 다시 고르기</button>
        <div class="topbar-right">
          <button class="dl-btn" id="downloadBtn" title="대화 다운로드">📥</button>
          <span class="topic-badge" id="topicBadge"></span>
        </div>
      </div>

      <div class="page" id="page"></div>

      <div class="input-row">
        <button class="mic-btn hidden" id="micBtn" title="음성으로 입력">🎤</button>
        <input type="text" id="userInput" placeholder="영어로 답해보세요" />
        <button class="send-btn" id="sendBtn">보내기</button>
      </div>
      <p class="mic-status" id="micStatus"></p>
      <div id="errorBox"></div>
      <p class="hint" id="bottomHint">🔊를 눌러 발음을 들어보세요 · Enter로 전송</p>
    </div>

  </div>

<script>
  const TOPICS = [
    { id:'casual', emoji:'☕', name:'일상 대화', desc:'가벼운 스몰토크', opener:"Hey! How's your day going so far?" },
    { id:'travel', emoji:'✈️', name:'여행 영어', desc:'공항, 호텔, 길찾기', opener:"Welcome! Is this your first time visiting? Where are you headed today?" },
    { id:'work', emoji:'💼', name:'비즈니스', desc:'회의, 이메일 톤', opener:"Thanks for hopping on the call. Could you give me a quick update on the project?" },
    { id:'dating', emoji:'💌', name:'소개팅', desc:'첫 만남 대화', opener:"Nice to finally meet you! So, what do you like to do on weekends?" },
    { id:'restaurant', emoji:'🍽️', name:'식당/주문', desc:'주문, 요청 표현', opener:"Hi there, welcome in! Have you had a chance to look at the menu yet?" },
    { id:'free', emoji:'🗒️', name:'자유 주제', desc:'아무 얘기나', opener:"Hi! I'm your practice partner today. What would you like to talk about?" },
  ];

  let currentTopic = null;
  let history = [];
  let loading = false;
  let recognizing = false;
  let recognition = null;
  let sessionLog = [];

  const topicScreen = document.getElementById('topicScreen');
  const chatScreen = document.getElementById('chatScreen');
  const stampGrid = document.getElementById('stampGrid');
  const page = document.getElementById('page');
  const topicBadge = document.getElementById('topicBadge');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const backBtn = document.getElementById('backBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const errorBox = document.getElementById('errorBox');
  const bottomHint = document.getElementById('bottomHint');
  const installBanner = document.getElementById('installBanner');
  const installText = document.getElementById('installText');
  const installClose = document.getElementById('installClose');

  /* ---------- Install (Add to Home Screen) hint ---------- */
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  if(!isStandalone){
    if(isIOS){
      installText.innerHTML = '<b>홈 화면에 추가하기</b> — Safari 하단의 공유 버튼(⬆︎)을 누른 뒤 "홈 화면에 추가"를 선택하면 앱처럼 아이콘으로 쓸 수 있어요. (반드시 Safari에서 열어야 해요)';
      installBanner.classList.remove('hidden');
    } else {
      installText.innerHTML = '<b>참고</b> — 이 파일은 아이폰 Safari에서 열어야 "홈 화면에 추가"가 가능해요.';
    }
  }
  installClose.addEventListener('click', () => installBanner.classList.add('hidden'));

  /* ---------- Speech recognition (voice input) ---------- */
  const micStatus = document.getElementById('micStatus');
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micFailed = false;

  // In-app browsers (like this chat view) and iOS Safari very often expose the
  // SpeechRecognition constructor but fail silently the moment you call start(),
  // which looks like the button flashing on then off. Rather than show a broken
  // control, we only offer the custom mic button where it reliably works, and
  // otherwise point people to the keyboard's built-in dictation key.
  const isLikelyInApp = /FBAN|FBAV|Instagram|Line\/|KAKAOTALK|NAVER|Claude/i.test(ua);
  const canUseCustomMic = !!SpeechRecognitionCtor && !isIOS && !isLikelyInApp;

  if(canUseCustomMic){
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('recording');
      micStatus.textContent = '';
    };
    recognition.onresult = (e) => {
      let transcript = '';
      for(let i=0;i<e.results.length;i++){ transcript += e.results[i][0].transcript; }
      userInput.value = transcript;
    };
    recognition.onerror = (e) => {
      recognizing = false;
      micBtn.classList.remove('recording');
      if(!micFailed){
        micFailed = true;
        micStatus.textContent = '음성 인식이 지원되지 않아요 · 키보드 마이크 아이콘을 이용해주세요';
      }
    };
    recognition.onend = () => { recognizing = false; micBtn.classList.remove('recording'); };

    micBtn.classList.remove('hidden');
    micBtn.addEventListener('click', () => {
      if(recognizing){ recognition.stop(); return; }
      userInput.value = '';
      try { recognition.start(); } catch(e){}
    });
    bottomHint.textContent = '🎤로 말하거나 직접 입력하고, 🔊로 발음을 들어보세요';
  } else {
    bottomHint.textContent = '💡 입력창을 탭한 뒤 키보드의 마이크 아이콘으로 말해서 입력할 수 있어요 · 🔊로 발음도 들어보세요';
  }

  /* ---------- Text to speech (partner voice) ---------- */
  let cachedVoice = null;

  function pickVoice(){
    if(!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    const enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = enVoices.length ? enVoices : voices;
    // Prefer higher-quality named voices that sound more natural than the
    // robotic default (common on iOS: "Samantha"; Chrome/Android: "Google US English").
    const preferredNames = ['Samantha', 'Google US English', 'Aria', 'Jenny', 'Ava', 'Nicky'];
    for(const name of preferredNames){
      const match = pool.find(v => v.name.includes(name));
      if(match) return match;
    }
    const usVoice = pool.find(v => v.lang.toLowerCase() === 'en-us');
    return usVoice || pool[0];
  }

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickVoice(); };
    cachedVoice = pickVoice();
  }

  function speak(text, btn){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 1;
    utter.pitch = 1;
    const voice = cachedVoice || pickVoice();
    if(voice) utter.voice = voice;
    if(btn){
      btn.classList.add('playing');
      utter.onend = () => btn.classList.remove('playing');
      utter.onerror = () => btn.classList.remove('playing');
    }
    window.speechSynthesis.speak(utter);
  }

  /* ---------- Topic rendering ---------- */
  function renderTopics(){
    stampGrid.innerHTML = '';
    TOPICS.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'stamp';
      btn.innerHTML = `
        <span class="stamp-emoji">${t.emoji}</span>
        <span class="stamp-name">${t.name}</span>
        <span class="stamp-desc">${t.desc}</span>
      `;
      btn.addEventListener('click', () => startChat(t));
      stampGrid.appendChild(btn);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function startChat(topic){
    currentTopic = topic;
    history = [{ role:'assistant', content: topic.opener }];
    topicBadge.textContent = `${topic.emoji} ${topic.name}`;
    page.innerHTML = '';
    addPartnerTurn(topic.opener);
    topicScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    userInput.value = '';
    errorBox.innerHTML = '';
    userInput.focus();

    const now = new Date();
    const stamp = now.toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit' });
    sessionLog.push(`\n=== ${topic.emoji} ${topic.name} (${stamp} 시작) ===`);
    sessionLog.push(`PARTNER: ${topic.opener}`);
  }

  function addPartnerTurn(text){
    const div = document.createElement('div');
    div.className = 'turn';
    div.innerHTML = `
      <p class="partner-label">PARTNER</p>
      <div class="partner-row">
        <p class="partner-line">${escapeHtml(text)}</p>
        <button class="speak-btn" title="들어보기">🔊</button>
      </div>
    `;
    const speakBtn = div.querySelector('.speak-btn');
    speakBtn.addEventListener('click', () => speak(text, speakBtn));
    page.appendChild(div);
    page.scrollTop = page.scrollHeight;
  }

  function addUserTurn(text, hasCorrection, corrected, explanationKr){
    const div = document.createElement('div');
    div.className = 'turn';
    const lineClass = hasCorrection ? 'user-line has-issue' : 'user-line';
    let feedbackHtml = '';
    if(hasCorrection){
      feedbackHtml = `
        <div class="redpen-row">
          <button class="speak-btn small" title="고친 문장 들어보기">🔊</button>
          <p class="redpen-note">${escapeHtml(corrected)}</p>
        </div>
        <p class="explain-note">${escapeHtml(explanationKr)}</p>
      `;
    } else {
      feedbackHtml = `<p class="ok-mark">Good!</p>`;
    }
    div.innerHTML = `
      <p class="user-label">YOU</p>
      <p class="${lineClass}">${escapeHtml(text)}</p>
      ${feedbackHtml}
    `;
    if(hasCorrection){
      const correctedSpeakBtn = div.querySelector('.speak-btn.small');
      correctedSpeakBtn.addEventListener('click', () => speak(corrected, correctedSpeakBtn));
    }
    page.appendChild(div);
    page.scrollTop = page.scrollHeight;
  }

  function addThinking(){
    const div = document.createElement('div');
    div.className = 'turn';
    div.id = 'thinkingTurn';
    div.innerHTML = `<p class="thinking">...typing</p>`;
    page.appendChild(div);
    page.scrollTop = page.scrollHeight;
  }

  function removeThinking(){
    const el = document.getElementById('thinkingTurn');
    if(el) el.remove();
  }

  function buildSystemPrompt(topicName){
    return `You are a warm, encouraging English conversation partner helping a Korean learner practice speaking English through a topic: "${topicName}".

Rules:
- Keep replying naturally in-character to continue the conversation (1-3 short sentences, casual spoken English, ask a follow-up question when it fits).
- Look at the learner's LATEST message only for correction purposes. If it has a real grammar, word-choice, or naturalness issue, set hasCorrection true and fill in "original" (the exact problematic fragment or full sentence as the learner wrote it), "corrected" (a natural fixed version), and "explanationKr" (ONE short, friendly sentence in Korean explaining the fix, no jargon).
- Do NOT invent issues. If the message is fine (even if simple), set hasCorrection false and leave original/corrected/explanationKr as empty strings.
- Never correct minor stylistic variation that is still correct English.
- Respond ONLY with raw JSON, no markdown fences, no preamble, matching exactly this shape:
{"reply": "string", "hasCorrection": boolean, "original": "string", "corrected": "string", "explanationKr": "string"}`;
  }

  async function callClaude(systemPrompt, msgHistory){
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: systemPrompt,
        messages: msgHistory
      })
    });
    const data = await response.json();
    if(data.error) throw new Error(data.error);
    const text = (data.content || []).map(b => b.text || "").join("").trim();
    const clean = text.replace(/^```json\s*|^```\s*|```$/g, "").trim();
    return JSON.parse(clean);
  }

  async function handleSend(){
    const text = userInput.value.trim();
    if(!text || loading) return;
    loading = true;
    sendBtn.disabled = true;
    errorBox.innerHTML = '';
    userInput.value = '';

    const newHistory = [...history, { role:'user', content:text }];
    addThinking();

    try {
      const result = await callClaude(buildSystemPrompt(currentTopic.name), newHistory);
      removeThinking();
      addUserTurn(text, !!result.hasCorrection, result.corrected || '', result.explanationKr || '');
      addPartnerTurn(result.reply || '...');
      history = [...newHistory, { role:'assistant', content: result.reply || '' }];

      sessionLog.push(`YOU: ${text}`);
      if(result.hasCorrection){
        sessionLog.push(`  → 더 자연스러운 표현: ${result.corrected}`);
        sessionLog.push(`  → 설명: ${result.explanationKr}`);
      }
      sessionLog.push(`PARTNER: ${result.reply || ''}`);
    } catch(e){
      removeThinking();
      errorBox.innerHTML = `<div class="error-box">응답을 받아오지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.</div>`;
    } finally {
      loading = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', handleSend);
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleSend();
  });
  backBtn.addEventListener('click', () => {
    window.speechSynthesis && window.speechSynthesis.cancel();
    chatScreen.classList.add('hidden');
    topicScreen.classList.remove('hidden');
  });

  downloadBtn.addEventListener('click', () => {
    if(!sessionLog.length){
      errorBox.innerHTML = `<div class="error-box">아직 저장할 대화 내용이 없어요.</div>`;
      return;
    }
    const today = new Date();
    const dateStr = today.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
    const header = `대화 노트 — 영어 회화 연습 기록\n${dateStr}\n${'='.repeat(30)}\n`;
    const content = header + sessionLog.join('\n') + '\n';

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `대화노트_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  renderTopics();
</script>
</body>
</html>
